* { margin: 0; padding: 0; box-sizing: border-box; }

.container { max-width: 680px; margin: 0 auto; padding: 16px; }

}

#splash .badge span {

    padding: 14px 52px; font-size: 1.05rem;

.btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(156,39,176,0.35); }

.q-screen.active { display: block; }

.progress {

}
.progress-bar {
    flex: 1; height: 8px;
    background: rgba(156,39,176,0.12);
    border-radius: 10px; overflow: hidden;
}
.progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #f06292, #ab47bc);
    border-radius: 10px;
    transition: width 0.5s ease;
}
.progress-num {
    font-size: 0.78rem; color: #9575cd;

}

.q-card {

    border-radius: 20px;
    box-shadow: 0 4px 20px rgba(156,39,176,0.06);
    animation: popIn 0.35s ease;
}

    from { opacity: 0; transform: scale(0.92) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}

.q-number {
    font-size: 0.75rem; color: #b39ddb;
    font-weight: 700; letter-spacing: 0.06em; margin-bottom: 8px;

    font-weight: 700;
    line-height: 1.6;
    color: #4a148c;
    margin-bottom: 22px;

.q-option {
    display: block; width: 100%;
    background: rgba(255,255,255,0.6);
    border: 2px solid rgba(206,147,216,0.2);
    border-radius: 14px;

    border-color: rgba(171,71,188,0.35);

.chart-val {

</style>

let currentQ = 0;
let answered = [];

function startTest() {
    document.getElementById('splash').style.display = 'none';
    currentQ = 0;
    answered = [];
    renderQuestion();
}

function renderQuestion() {
    const area = document.getElementById('questionArea');
    const q = QUESTIONS[currentQ];
    const total = QUESTIONS.length;
    const pct = (currentQ / total * 100);

    let opts = q.a.map((a, i) => {
        const sel = answered[currentQ] === i ? ' selected' : '';
        return `<button class="q-option${sel}" onclick="selectAnswer(${i})">${a.text}</button>`;
    }).join('');

    area.innerHTML = `
    <div class="q-screen active">
        <div class="progress">
            <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
            <div class="progress-num">${currentQ+1}/${total}</div>
        </div>
        <div class="q-card">
            <div class="q-number">第 ${currentQ+1} 题</div>
            <div class="q-text">${q.q}</div>
            ${opts}
        </div>
    </div>`;
    area.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function selectAnswer(idx) {
    answered[currentQ] = idx;
    renderQuestion();
    setTimeout(() => {
        if (currentQ < QUESTIONS.length - 1) {
            currentQ++;
            renderQuestion();
        } else {
            calculateResult();
        }
    }, 300);
}

function calculateResult() {
    const scores = {};
    TYPES.forEach(t => scores[t.id] = 0);

    answered.forEach((ansIdx, qi) => {
        if (ansIdx === undefined) return;
        const targets = QUESTIONS[qi].a[ansIdx].t;
        targets.forEach(tid => { if (scores[tid] !== undefined) scores[tid]++; });
    });

    const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
    const topId = sorted[0][0];
    const result = TYPES.find(t => t.id === topId);

    document.getElementById('questionArea').style.display = 'none';
    const resultEl = document.getElementById('result');
    resultEl.classList.add('active');

    const sections = ['侦探篇','反派篇','死者篇'];
    const sectionEmojis = {'侦探篇':'🔍','反派篇':'🌙','死者篇':'💀'};
    const secIdx = sections.indexOf(result.section);
    const catEmojis = ['🐱‍👤','🐱‍👿','🐱‍💀'];

    const box = document.getElementById('resultBox');
    box.innerHTML = `
        <div class="result-type-badge">${sectionEmojis[result.section]} ${result.section}</div>
        <div class="result-cat">${result.cat}</div>
        <div class="result-name">${result.name}</div>
        <div style="color:#7e57c2;font-size:0.85rem;font-weight:700;margin-bottom:6px">${result.nameEn}</div>
        <div class="result-tags">${result.tags.map(t => `<span>${t}</span>`).join('')}</div>
    `;

    const chartEl = document.getElementById('chartWrap');
    const maxScore = sorted[0][1];
    let chartHtml = '<div class="chart-title">全部角色得分</div>';
    sorted.forEach(([id, score], idx) => {
        const t = TYPES.find(t => t.id === id);
        const pct = maxScore > 0 ? (score / maxScore * 100) : 0;
        const isTop = id === topId;
        chartHtml += `
        <div class="chart-item" style="animation-delay:${idx*0.05}s">
            <div class="chart-label" style="${isTop?'color:#6a1b9a':''}">${t.cat} ${t.name}</div>
            <div class="chart-bar-bg"><div class="chart-bar${isTop?' top':''}" style="width:${pct}%"></div></div>
            <div class="chart-val" style="${isTop?'color:#6a1b9a':''}">${score}</div>
        </div>`;
    });
    chartEl.innerHTML = chartHtml;

    setTimeout(() => {
        // Add description section after chart
        const descSection = document.createElement('div');
        descSection.className = 'result-section';
        descSection.style.animation = 'popIn 0.5s ease';
        descSection.innerHTML = `
            <h3>人格特质</h3>
            <p>${result.desc}</p>
        `;
        chartEl.after(descSection);

        const quoteSection = document.createElement('div');
        quoteSection.className = 'result-section';
        quoteSection.style.animation = 'popIn 0.5s ease';
        quoteSection.innerHTML = `
            <h3>经典名言</h3>
            <p style="font-style:italic;color:#7b5ea7">${result.quote}</p>
        `;
        descSection.after(quoteSection);

        resultEl.scrollIntoView({ behavior: 'smooth' });
    }, 300);
}

function restart() {
    document.getElementById('result').classList.remove('active');
    document.getElementById('questionArea').style.display = '';
    document.getElementById('splash').style.display = 'flex';
    // Remove any result sections that were dynamically added
    document.querySelectorAll('.result-section').forEach(el => el.remove());
    currentQ = 0;
    answered = [];
}
